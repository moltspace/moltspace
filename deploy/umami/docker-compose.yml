# Umami analytics for a Moltspace instance (optional).
#
#   cd deploy/umami && cp .env.example .env    # fill in the two secrets
#   docker compose up -d
#
# The dashboard is private: Umami listens on 127.0.0.1 (for Caddy) and on UMAMI_LAN_IP
# (your VPN/LAN address) only. The public site exposes just the tracker script and the
# collect endpoint, proxied under the site's own origin (see OPERATIONS.md "Analytics").
# It has its own Postgres container, so it never touches the Moltspace database.
# First login: admin / umami. Change it immediately.

services:
  umami:
    image: ghcr.io/umami-software/umami:3.5.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
      - "${UMAMI_LAN_IP:?set UMAMI_LAN_IP in .env (the VPN/LAN address to open the dashboard on)}:3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
      DISABLE_TELEMETRY: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  umami-db:
